; L4N 2.53.0 + necola 1.4.1 合并版配置
; true 表示启用，false 表示关闭；以下保留原版说明，并补充整合后的使用限制。
; 重复功能优先使用 L4N：主动检视、开镜、额外粒子清单加载和堆内存配置。
; 启动参数和渲染缓冲区请在 L4N 中设置，不使用 necola 独立启动器的 [System] 配置。
; necola 先读取本文件，再读取 necola/FeatureConfig.json；同一功能可能受 JSON 覆盖。
; 标为“由 L4N 接管”的开关必须保持 false；改为 true 会使桥接在下次启动时拒绝加载 necola。

[Necola]
; 1.0 版本配置
; 启用弹药与血量回写，供支持 necola 协议的模型/材质使用。
openStatuStatistics = true
; 启用击杀回写；统计方式另见 FeatureConfig.json 的 KillStatistics 配置。
openKillStatistics = true
; 使用缓存计数（原版注释注明“目前无效”），保持关闭。
useConfigWithStats = false

; 1.2 版本配置
; 启用 necola 主动检视。由 L4N 接管，必须保持 false。
; 同时保持 FeatureConfig.json 中 InspectInitiative.EnableInspect = false。
openInspect = false
; necola 主动检视按键的虚拟键码（原版称 VCKey）；82 对应 R 键。
; 因 necola 主动检视关闭，此项不控制 L4N 按键；L4N 请使用菜单或 +l4n_lookat。
inspectKey = 82
; 主动检视触发对倒地队友伸手动画的百分比（沿用原版说明）。
; necola 主动检视关闭时，此项不用于 L4N 检视。
helpingHandRandom = 1

; 1.3 版本配置
; 启用序列同步，保留 necola 专用武器动画的兼容能力。
animSequenceModify = true
; 忽略单喷的开火与推动画（沿用原版说明）。
ignoreShotgunSequence = true
; 原样例还列出 disableSequenceNetworkSync（停用序列网络同步），
; 但未确认该键在当前 DLL 中生效，因此本合并版不写入此键。
; 启用每种武器的独立弹道/曳光，需要配套粒子资源及 necola/weaponParticles.json。
shootingParticlesFXChange = true
; 加载额外粒子清单文件。由 L4N 接管，必须保持 false。
; 额外 PCF 按 L4N 规范放入 l4n/particles，需预载的文件保留 ! 前缀。
customParticleManifest = false

; 1.4 版本配置
; 启用 necola 武器多模型兼容功能，需要适配模型及元数据。
; 缺少对应数据时，原 DLL 会自动关闭此功能；与 L4N 模型组件菜单不是同一接口。
enableModelPolymorphism = true

; 原 DLL 保留的 enableEntityDisslvor 开关（名称沿用原拼写）。
; 随包没有功能说明，具体效果尚未验证，保持关闭。
enableEntityDisslvor = false
; 启用 necola 的堆内存相关 hook。由 L4N 接管，必须保持 false。
enableHeapSizeHook = false
; 等待可选 serverbrowser.dll 模块的时间参数。
; 当前值 5 在实际实现中最多等待约六次一秒轮询，然后继续初始化。
; L4N 可能不加载该模块，设置有界等待可避免 necola 一直停留在初始化等待阶段。
injectWaitTime = 5

[AdsSupport]
; 启用 necola ADS 开镜。由 L4N 接管，必须保持 false。
; 同时保持 FeatureConfig.json 中 AdsSupport.EnableAdsSupport = false。
; 当前 DLL 实际读取本节此键，不使用原样例 [Necola] 下的 adsSupport。
; 因总开关关闭，necola 专用四级 ADS、MIXED、Mode C 挂件瞄具在本版也不启用。
enableAdsSupport = false

; 以下三节来自原样例，未确认这些键在当前 necola 版本中生效。
; 保留 enable = false 作为兼容配置，不以此声称 DLL 内相应补丁已被关闭。
; 缓冲区大小请使用 L4N 的 index_buffer_size / vertex_buffer_size 配置。

; Too Many Indices 的上限数值（原版说明：buffer 大小 + 判断）。
[Indices]
enable = false

; dynamic vertex buffer 大小限制（原版说明：修改 buffer 大小）。
[DynamicVB]
enable = false

; dynamic vertex buffer 判断限制（原版说明：只修改上限判断）。
[GetMaxToRender]
enable = false
