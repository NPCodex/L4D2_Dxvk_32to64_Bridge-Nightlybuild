name: Build L4D2 D3D9 Bridge
on:
  push:
    branches:
      - codex/l4d2-demo
      - codex/development-1.1.2-dev.1
      - main
      - codex/release-1.3.0
      - codex/ipc-upload-safety
      - codex/ipc-data-queue-correctness
  workflow_dispatch:
    inputs:
      build_l4n:
        description: 'Build and package the optional L4N plugin (disable for Bridge-only updates)'
        type: boolean
        default: true
      publish_existing_prerelease:
        description: 'Attach verified ZIPs to an existing experimental release draft'
        type: boolean
        default: false
      experimental_zip_commit:
        description: 'Immutable commit of the ZIP-only download branch'
        type: string
        default: ''
      experimental_zip_checksums:
        description: 'JSON map of the two experimental ZIP filenames to SHA256'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  windows-build:
    if: github.event_name != 'workflow_dispatch' || !inputs.publish_existing_prerelease
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yeyunyyds/L4D2_Dxvk_32to64_Bridge
          ref: 8730d84b77c596efdabfad54b7458a8f0aeb01a4
          path: .deps/ipc-v2-pr6
      - uses: actions/checkout@v4
        with:
          repository: yeyunyyds/L4D2_Dxvk_32to64_Bridge
          ref: 00007e8762385704afdacabea6e48444d798d27a
          path: .deps/c32-frozen
      - uses: actions/checkout@v4
        with:
          repository: yeyunyyds/L4D2_Dxvk_32to64_Bridge
          ref: f6a059b758f9fcbf9c66ace73625aae9db34ad6a
          path: .deps/v130-frozen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read project version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "L4D2_PROJECT_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Download pinned upstream DXVK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .deps | Out-Null
          curl.exe --fail --location --retry 3 --retry-delay 5 --max-time 90 https://github.com/doitsujin/dxvk/releases/download/v2.6.1/dxvk-2.6.1.tar.gz --output .deps/dxvk.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'DXVK download failed' }
          $expected = '7ee0bef415910c943d3bda47d9d6821b9c8ca7a74f1e9f6151707d268cf3ce7f'
          if ((Get-FileHash .deps/dxvk.tar.gz -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'DXVK checksum mismatch' }
          tar -xzf .deps/dxvk.tar.gz -C .deps
          if ($LASTEXITCODE -ne 0) { throw 'DXVK extraction failed' }
      - name: Prepare pinned Bridge sources
        run: python scripts/prepare_bridge.py
      - name: Full IPC v2 and integrated Steam native regressions
        shell: powershell
        run: |
          python scripts/prepare_v130_fixture.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen fixture preparation failed' }
          foreach ($test in @('ipc_full','buffer_shadow_arena','steam_window_diagnostics','steam_web_diagnostics','steam_availability_diagnostics','steam_workshop_status')) {
            & powershell.exe -NoProfile -File "./scripts/test_$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
      - name: Upload safety, close tails and default reply budgets against frozen v1.3.0
        shell: powershell
        run: ./scripts/test_ipc_upload_safety.ps1
      - name: Test Client input hooks, legacy DirectInput results and Query logging
        shell: powershell
        run: ./scripts/test_input_hooks.ps1
      - name: Test disabled diagnostic work and on-demand input on x86 and x64
        shell: powershell
        run: |
          ./scripts/test_runtime_observation.ps1
          python -m unittest discover -s tests -p test_runtime_separation.py
          if ($LASTEXITCODE -ne 0) { throw 'Runtime separation contract tests failed' }
      - name: Retained legacy layout units and production API failure ownership
        shell: powershell
        run: |
          ./scripts/test_data_ring_contract.ps1
          ./scripts/test_ipc_api_failure.ps1
      - name: Build optional L4N v2 HUD control plugin
        if: github.event_name != 'workflow_dispatch' || inputs.build_l4n
        shell: powershell
        run: ./scripts/build_l4n_plugin.ps1
      - name: Test PageBlock residency, GC and L4N v2 callbacks
        shell: powershell
        run: |
          $skipPlugin = '${{ github.event_name == 'workflow_dispatch' && !inputs.build_l4n }}' -eq 'true'
          ./scripts/test_pageblock_gc.ps1 -SkipPluginTests:$skipPlugin
      - name: Build x86 client, x64 host and isolated x86 comparison host
        shell: powershell
        run: |
          $bridgeOnly = '${{ github.event_name == 'workflow_dispatch' && !inputs.build_l4n }}' -eq 'true' -and $env:L4D2_PROJECT_VERSION.Contains('-dev')
          ./scripts/build_bridge.ps1 -DxvkDll .deps/dxvk-2.6.1/x64/d3d9.dll -Dxvk32Dll .deps/dxvk-2.6.1/x32/d3d9.dll -PatchOnly:$bridgeOnly
      - name: Test exception attribution, flushing and bounded termination
        shell: powershell
        run: ./scripts/test_exception_diagnostics.ps1
      - name: Test mandatory device reset results and failure state
        shell: powershell
        run: ./scripts/test_device_reset.ps1
      - name: Test bounded color diagnostics, texture wire and temporary query references
        shell: powershell
        run: |
          ./scripts/test_color_diagnostics.ps1
          python -m unittest discover -s tests -p test_color_analysis.py
          if ($LASTEXITCODE -ne 0) { throw 'Color log analysis tests failed' }
      - name: Test independent L4N Release packaging
        run: python -m unittest discover -s tests -p test_release_packaging.py
      - name: Test data/resource tracing and offline analysis on x86 and x64
        shell: powershell
        run: |
          ./scripts/test_data_diagnostics.ps1
          python -m unittest discover -s tests -p test_data_analysis.py
          if ($LASTEXITCODE -ne 0) { throw 'Data log analysis tests failed' }
      - name: Test x86 VB and IB historical contents and multiple Lock contract
        shell: powershell
        run: ./scripts/test_buffer_contract.ps1
      - name: Test Volume byte pitches and partial uploads on x86 and x64
        shell: powershell
        run: ./scripts/test_volume_layout.ps1
      - name: Package experimental PageBlock controls
        if: contains(env.L4D2_PROJECT_VERSION, '-dev') && (github.event_name != 'workflow_dispatch' || inputs.build_l4n)
        run: python scripts/package_pageblock_experiment.py
      - name: Test x86 diagnostics and shadow eviction
        shell: powershell
        run: ./scripts/test_diagnostics.ps1
      - name: Test x64 Host memory and CPU diagnostics
        shell: powershell
        run: ./scripts/test_host_diagnostics.ps1
      - name: Test x86 Host address and process memory diagnostics
        shell: powershell
        run: ./scripts/test_host_diagnostics.ps1 -Platform x86
      - name: Load the official x86 DXVK DLL in a native x86 process
        shell: powershell
        run: |
          if ('${{ github.event_name == 'workflow_dispatch' && !inputs.build_l4n }}' -eq 'true') {
            ./scripts/test_x86_backend.ps1 -DllPath .deps/dxvk-2.6.1/x32/d3d9.dll
          } else { ./scripts/test_x86_backend.ps1 }
      - name: Test native x86 and x64 adapter identifiers and Shader capability transport
        shell: powershell
        run: ./scripts/test_adapter_information.ps1
      - name: Test ATI1 and ATI2 guarded texture transfers on x86 and x64
        shell: powershell
        run: ./scripts/test_ati_texture_layout.ps1
      - name: Test cross-process overlay presentation windows and input capture
        shell: powershell
        run: ./scripts/test_overlay_presenter.ps1
      - name: Test API wait attribution and snapshots on x86 and x64
        shell: powershell
        run: |
          ./scripts/test_api_wait_diagnostics.ps1
          python -m unittest discover -s tests -p test_api_wait_analysis.py
          if ($LASTEXITCODE -ne 0) { throw 'API wait snapshot analysis tests failed' }
      - name: Test command queue idle CPU and x86 to x64 wakeups
        shell: powershell
        run: ./scripts/test_command_queue.ps1
      - name: Test readback, real backing eviction, recovery and persistent retention
        shell: powershell
        run: ./scripts/test_readback_recovery.ps1
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || inputs.build_l4n || !contains(env.L4D2_PROJECT_VERSION, '-dev')
        with:
          name: l4d2-bridge-v${{ env.L4D2_PROJECT_VERSION }}
          path: dist/l4d2-bridge/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: l4d2-bridge-patch-v${{ env.L4D2_PROJECT_VERSION }}
          path: dist/l4d2-bridge-patch/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: "!contains(env.L4D2_PROJECT_VERSION, '-dev') && (github.event_name != 'workflow_dispatch' || inputs.build_l4n)"
        with:
          name: l4d2-bridge-l4n-v${{ env.L4D2_PROJECT_VERSION }}
          path: dist/l4d2-bridge-l4n/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: contains(env.L4D2_PROJECT_VERSION, '-dev') && (github.event_name != 'workflow_dispatch' || inputs.build_l4n)
        with:
          name: l4d2-bridge-pageblock-drop-experiment
          path: dist/l4d2-pageblock-drop-experiment/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l4d2-native-v${{ env.L4D2_PROJECT_VERSION }}-${{ github.run_id }}
          path: |
            work/ipc-full-native/
            work/ipc-safety-baseline/
            work/upload-safety-*/
            work/ipc-safety-replies.json
            work/release-build.json
            .deps/observation-test-*/
            .deps/steam-*/
            .deps/pageblock-gc-test/
            .deps/dxvk-remix/bridge/_compRelease_*/meson-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish-existing-prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_existing_prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify prepared ZIPs, native CI and experimental draft before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          L4D2_PUBLISH_REPOSITORY: ${{ github.repository }}
          L4D2_ZIP_COMMIT: ${{ inputs.experimental_zip_commit }}
          L4D2_ZIP_CHECKSUMS: ${{ inputs.experimental_zip_checksums }}
        run: python scripts/publish_experimental.py
