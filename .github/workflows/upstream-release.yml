name: Build latest upstream Bridge
on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'licenses/**'
      - 'runtime/**'
      - 'plugins/**'
      - 'docs/**'
      - 'experiments/**'
      - '.github/workflows/**'
      - 'VERSION'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
  schedule:
    # Observe NVIDIA HEAD; only config/nvidia-upstream.json's approved SHA may build.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "强制重建；现有Release替换模式只构建，禁止自动发布"
        required: false
        default: false
        type: boolean
      upstream_commit:
        description: 'Optional authorized NVIDIA full SHA override; empty observes HEAD and builds the approved config pin'
        required: false
        type: string
      validation_only:
        description: 'Build, test and benchmark without publishing a release'
        required: false
        default: false
        type: boolean
      thinflex_test:
        description: 'Label the full upstream integration + ThinFlex package as a test release'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: upstream-release-build
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      pending: ${{ steps.detect.outputs.pending }}
      publish_allowed: ${{ steps.detect.outputs.publish_allowed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: detect
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/detect_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}
          THINFLEX_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.thinflex_test }}
  build:
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Vulkan shader compiler for GPLALL source build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install vulkan-sdk --version=1.4.363 -y --no-progress
          $validator = $null
          $command = Get-Command glslangValidator -ErrorAction SilentlyContinue
          if ($command) {
            $validator = Get-Item -LiteralPath $command.Source
          }
          if (-not $validator) {
            $roots = @(
              'C:\VulkanSDK',
              (Join-Path $env:ProgramFiles 'VulkanSDK'),
              (Join-Path ${env:ProgramFiles(x86)} 'VulkanSDK')
            ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
            $validator = Get-ChildItem -Path $roots -Filter glslangValidator.exe -File -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              Select-Object -First 1
          }
          if (-not $validator) { throw 'Vulkan SDK installation did not provide glslangValidator.exe' }
          & $validator.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'glslangValidator version probe failed' }
          $validator.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Build matched Release x86 Client, both Hosts and bundled L4N plugin
        shell: powershell
        run: ./scripts/build_bridge.ps1 -UpstreamCommit $env:UPSTREAM_COMMIT
        env:
          UPSTREAM_COMMIT: ${{ matrix.commit }}
      - name: Test IPC v2 (360 transport pairs, 24 fail-closed), resource contracts and both Hosts
        shell: powershell
        run: ./scripts/test_upstream_features.ps1
      - name: Test diagnostics and shadow eviction
        shell: powershell
        run: ./scripts/test_diagnostics.ps1
      - name: Test resource creation cleanup and buffer lock bounds
        shell: powershell
        run: ./scripts/test_resource_lifecycle.ps1
      - name: Test API logger allocations and preserved log behavior (x86 and x64)
        shell: powershell
        run: ./scripts/test_function_logging.ps1
      - name: Test input hook errors, DirectInput results and Query references (x86 and x64)
        shell: powershell
        run: ./scripts/test_input_hooks.ps1
      - name: Test lazy logging and buffer shadow behavior (x86 and x64)
        shell: powershell
        run: ./scripts/test_lazy_logging.ps1
      - name: Benchmark disabled API logger overhead
        if: ${{ inputs.validation_only }}
        shell: powershell
        run: ./scripts/benchmark_function_logging.ps1
      - name: Test idempotent Host device cleanup and strict live-command guards
        shell: powershell
        run: ./scripts/test_device_destroy.ps1 -VcVarsVer 14.29
      - name: Test Remix initialization status, startup guard and response identity
        shell: powershell
        run: ./scripts/test_remix_init.ps1 -VcVarsVer 14.29
      - name: Test runtime filesystem selection, fallback and client configuration path
        shell: powershell
        run: ./scripts/test_runtime_filesys.ps1 -VcVarsVer 14.29
      - name: Test ReShade Home with pinned upstream input hooks and native Presenter routing
        shell: powershell
        run: |
          python scripts/fetch_reshade_keyboard_source.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned ReShade test source fetch failed' }
          ./scripts/test_overlay_reshade_keyboard.ps1 -Source .deps/dxvk-remix -Output .deps/overlay-reshade-keyboard -VcVarsVer 14.29
          if ($LASTEXITCODE -ne 0) { throw 'ReShade Home keyboard regression failed' }
      - name: Test Host swapchain query and Reset temporary references
        shell: powershell
        run: ./scripts/test_device_reset_lifetime.ps1
      - name: Test ATI texture transfer bounds (x86 and x64)
        shell: powershell
        run: ./scripts/test_ati_texture_layout.ps1
      - name: Test command queue wakeups and cross-process transport
        shell: powershell
        run: ./scripts/test_command_queue.ps1 -ExpectReadyFastPath
      # IPC3 Command guard fixtures require the retired Header/Data Ring.
      # test_ipc_full in test_upstream_features covers actual v2 command publication,
      # concurrent senders, fail-closed/UID replies, leases and both architectures.
      - name: Benchmark command queue ordering
        if: ${{ inputs.validation_only }}
        shell: powershell
        run: ./scripts/test_command_queue.ps1 -Benchmark -ExpectReadyFastPath
      - name: Test actual volume lock and upload code (x86 and x64)
        shell: powershell
        run: ./scripts/test_volume_texture.ps1
      - name: Test actual surface upload code (x86 and x64)
        shell: powershell
        run: ./scripts/test_surface_upload.ps1
      - name: Benchmark surface upload copying
        if: ${{ inputs.validation_only }}
        shell: powershell
        run: ./scripts/test_surface_upload.ps1 -Benchmark
      - name: Benchmark volume upload copying
        if: ${{ inputs.validation_only }}
        shell: powershell
        run: ./scripts/test_volume_texture.ps1 -Benchmark
      - name: Verify prepared source has not drifted during native validation
        shell: powershell
        run: python scripts/record_build_validation.py
      - name: Save native validation results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.release_tag }}
          path: |
            .deps/build-validation.json
            .deps/steam-ime-native/**
            .deps/overlay-keyboard-route/**
            .deps/overlay-ime-result/**
            .deps/overlay-presenter-test/**
            .deps/device-destroy-contract/**
            .deps/remix-init-contract/**
            .deps/runtime-filesys/**
            .deps/overlay-reshade-keyboard/**
            .deps/reshade-keyboard-source/**
            .deps/gplall/modified/msaa-linear-dont-unroll-20261013/**/d3d9.recipe.json
            .deps/gplall/source-build/BACKEND-SOURCE.json
            .deps/gplall/source-build/PATCHES-APPLIED.json
            dist/l4d2-bridge/BACKEND.json
            .deps/queue-test/*.json
            .deps/queue-test/*.csv
            .deps/queue-test/*.exe
            .deps/volume-test/*.json
            .deps/volume-test/*.csv
            .deps/volume-test/*.exe
            .deps/surface-test/*.json
            .deps/surface-test/*.csv
            .deps/surface-test/*.exe
            .deps/function-logging-test/**
            .deps/memory-sampling-test/**
            .deps/hot-command-packets/*.json
            .deps/hot-command-packets/*.exe
            work/ipc-full-native/**
            work/vbib-mapped-native/**
            .deps/client-parameter-contract/**
            .deps/host-upload-contract-*/**
            .deps/retention-journal-test/**
            .deps/optimization45-ipc-test/**
            .deps/ipc-reply-budget/**
            .deps/steam-window-test/**
            .deps/steam-web-test/**
            .deps/steam-workshop-x86/**
            .deps/steam-workshop-x64/**
            .deps/steam-invite-guard-test/**
          include-hidden-files: true
          if-no-files-found: warn
      - name: Build and verify the native ThinFlex repair tool
        shell: powershell
        run: |
          ./scripts/build_thinflex_native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native ThinFlex build failed' }
          ./scripts/test_thinflex_native.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native ThinFlex equivalence tests failed' }
      - name: Record provenance and archive
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ matrix.tag }}
          UPSTREAM_BRANCH: ${{ matrix.branch }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          RECIPE_COMMIT: ${{ github.sha }}
          RELEASE_TITLE: ${{ matrix.title }}
          ARCHIVE_NAME: ${{ matrix.archive }}
          RECIPE_DIGEST: ${{ matrix.recipe_digest }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          BUILD_INSTANCE: ${{ matrix.build_instance }}
          DELIVERY_MODE: ${{ matrix.delivery_mode }}
          REPLACEMENT_RELEASE_ID: ${{ matrix.release_id }}
          BUILD_KIND: ${{ matrix.kind }}
          COMMITS_AFTER_TAG: ${{ matrix.distance }}
          THINFLEX_TEST: ${{ inputs.thinflex_test }}
        run: |
          $metadata = @{ release_tag = $env:RELEASE_TAG; upstream_branch = $env:UPSTREAM_BRANCH; upstream_commit = $env:UPSTREAM_COMMIT; recipe_commit = $env:RECIPE_COMMIT; recipe_digest = $env:RECIPE_DIGEST; build_run = $env:GITHUB_RUN_ID; build_attempt = $env:GITHUB_RUN_ATTEMPT; game_validation = 'Native validation and exact Bridge/backend source receipts are attached to this Actions run. Actual game acceptance is recorded separately in the version-specific Release notes and documentation; CI does not establish gameplay, FPS or all-scene image-quality results.'; thinflex_tool_included = $false; thinflex_engine_patch_applied = $true; release_channel = 'nightly' }
          if ($env:THINFLEX_TEST -eq 'true') { $metadata.release_channel = 'thinflex-test' }
          $metadata.build_instance = $env:BUILD_INSTANCE
          $metadata.delivery_mode = $env:DELIVERY_MODE
          if ($env:DELIVERY_MODE -eq 'replace-existing') { $metadata.replacement_release_id = [long]$env:REPLACEMENT_RELEASE_ID }
          $original = Get-Content config/original-project.json -Raw | ConvertFrom-Json
          $metadata.original_project = $original.repository
          $metadata.original_project_commit = $original.commit
          $metadata.original_project_version = $original.version
          $metadata.original_project_integration = $original.integration
          $metadata.original_project_main_baseline = $original.main_baseline
          if ($original.integration -eq 'partial') {
            $metadata.original_project_reviewed_commit = $original.reviewed_commit
            $metadata.original_project_partial_commit = $original.partial_commit
            $metadata.original_project_partial_version = $original.partial_version
            $metadata.original_project_partial_content = $original.partial_content
          }
          $metadata.host_architectures = @('x86', 'x64')
          $metadata.default_host_architecture = 'x64'
          $metadata.l4n_plugin = 'bin/neko/plugins/L4D2BridgePlugin.dll'
          $metadata.l4n_plugin_installed = $true
          $l4n = Get-Content runtime/l4n/manifest.json -Raw -Encoding utf8 | ConvertFrom-Json
          $metadata.l4n_version = $l4n.version
          $metadata.l4n_author = $l4n.author
          $metadata.l4n_source_archive_sha256 = $l4n.source_archive_sha256
          $metadata.l4n_manifest = 'L4N-PAYLOAD.json'
          $metadata.l4n_user_preset_paths = $l4n.user_preset_paths
          $metadata.l4n_necola_version = $l4n.necola_integration.necola_version
          $metadata.l4n_necola_source_archive_sha256 = $l4n.necola_integration.source_archive_sha256
          $metadata | ConvertTo-Json | Set-Content dist/l4d2-bridge/UPSTREAM.json -Encoding utf8
          python scripts/archive_runtime.py dist/l4d2-bridge $env:ARCHIVE_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          "$((Get-FileHash $env:ARCHIVE_NAME -Algorithm SHA256).Hash.ToLower())  $env:ARCHIVE_NAME" | Set-Content "$env:ARCHIVE_NAME.sha256" -Encoding ascii
      - name: Save exact build delivery provenance
        uses: actions/upload-artifact@v4
        with:
          name: provenance-${{ matrix.release_tag }}
          path: dist/l4d2-bridge/UPSTREAM.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_tag }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
  publish:
    needs: [detect, build]
    if: ${{ needs.detect.outputs.pending == 'true' && needs.detect.outputs.publish_allowed == 'true' && needs.build.result == 'success' && !inputs.validation_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.release_tag }}
          path: assets
      - name: Publish verified full package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          UPSTREAM_TAG: ${{ matrix.tag }}
          UPSTREAM_BRANCH: ${{ matrix.branch }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          RECIPE_COMMIT: ${{ github.sha }}
          RECIPE_DIGEST: ${{ matrix.recipe_digest }}
          RELEASE_TITLE: ${{ matrix.title }}
          ARCHIVE_NAME: ${{ matrix.archive }}
          THINFLEX_TEST: ${{ inputs.thinflex_test }}
          BUILD_KIND: ${{ matrix.kind }}
          COMMITS_AFTER_TAG: ${{ matrix.distance }}
        run: python scripts/publish_release.py
