name: IPC C32 experimental bridge
on:
  workflow_dispatch:
  push:
    branches: ['codex/ipc-c32-development', 'codex/steam-overlay-hook-chain', 'codex/steam-overlay-mouse-capture', 'codex/steam-overlay-poll-chain', 'codex/steam-window-diagnostics']
    paths: ['.github/workflows/ipc-c32-development.yml', 'patches/ipc-c32.patch', 'experiments/ipc-c32/**', 'scripts/*ipc_c32*', 'scripts/test_*.ps1', 'scripts/assert_native_architecture.ps1', 'tests/ipc-v2/c32*', 'tests/input_hooks_test.cpp', 'tests/overlay_presenter.cpp', 'tests/steam_window*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yeyunyyds/L4D2_Dxvk_32to64_Bridge
          ref: 8730d84b77c596efdabfad54b7458a8f0aeb01a4
          path: .deps/ipc-v2-pr6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Prepare production main plus correctness and C32 overlay
        run: |
          python scripts/prepare_bridge.py
          python scripts/prepare_ipc_c32.py
      - name: Test actual C32 production serializer cross-process and retained pointers
        shell: powershell
        run: ./scripts/test_ipc_c32.ps1
      - name: Run compatible existing native regressions
        shell: powershell
        run: |
          # Each suite starts from the clean step environment. Repeated SetupVS
          # in one PowerShell process can grow PATH until vcvars silently fails.
          foreach ($suite in @('buffer_contract','volume_layout','device_reset','readback_recovery','input_hooks','overlay_presenter','steam_window_diagnostics','adapter_information','ati_texture_layout','command_queue')) {
            & powershell.exe -NoProfile -File "./scripts/test_$suite.ps1"
            if ($LASTEXITCODE -ne 0) { throw "Native regression failed: $suite" }
          }
      - name: Python contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build and verify matched experimental Release bridge
        shell: powershell
        run: ./scripts/build_ipc_c32.ps1
      - name: Preserve binaries, tests, logs and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipc-c32-development-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            work/ipc-c32-build.json
            work/ipc-c32-native/
            .deps/dxvk-remix/bridge/_ipcC32_*/meson-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
