name: IPC C32 experimental bridge
on:
  workflow_dispatch:
  push:
    branches: ['codex/ipc-c32-development']
    paths: ['patches/ipc-c32.patch', 'experiments/ipc-c32/**', 'scripts/*ipc_c32*', 'tests/ipc-v2/c32*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yeyunyyds/L4D2_Dxvk_32to64_Bridge
          ref: 8730d84b77c596efdabfad54b7458a8f0aeb01a4
          path: .deps/ipc-v2-pr6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Prepare production main plus correctness and C32 overlay
        run: |
          python scripts/prepare_bridge.py
          python scripts/prepare_ipc_c32.py
      - name: Test actual C32 production serializer cross-process and retained pointers
        shell: powershell
        run: ./scripts/test_ipc_c32.ps1
      - name: Run compatible existing native regressions
        shell: powershell
        run: |
          ./scripts/test_buffer_contract.ps1
          ./scripts/test_volume_layout.ps1
          ./scripts/test_device_reset.ps1
          ./scripts/test_readback_recovery.ps1
          ./scripts/test_input_hooks.ps1
          ./scripts/test_adapter_information.ps1
          ./scripts/test_ati_texture_layout.ps1
          ./scripts/test_command_queue.ps1
      - name: Python contracts
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build and verify matched experimental Release bridge
        shell: powershell
        run: ./scripts/build_ipc_c32.ps1
      - name: Preserve binaries, tests, logs and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipc-c32-development-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            work/ipc-c32-build.json
            work/ipc-c32-native/
            .deps/dxvk-remix/bridge/_ipcC32_*/meson-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
